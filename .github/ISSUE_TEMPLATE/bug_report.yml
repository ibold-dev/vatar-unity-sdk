name: Bug report
description: Report a reproducible defect in the Unity package.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Do not include Vatar secrets, session tokens, payment IDs, or personal data.
  - type: input
    id: version
    attributes:
      label: Package and Unity versions
      placeholder: com.vatar.games 0.1.0-pre.0; Unity 2022.3.0f1
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Build target
      options:
        - WebGL in Vatar sandbox
        - WebGL outside Vatar player
        - Unity Editor
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
